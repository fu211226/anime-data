name: Update anime data

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current season from AniList
        env:
          TZ: Asia/Tokyo
        run: |
          python - <<'PY'
          import datetime, json, urllib.request

          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          m=now.month
          season='WINTER' if m<=3 else 'SPRING' if m<=6 else 'SUMMER' if m<=9 else 'FALL'
          year=now.year

          query='''
          query($season:MediaSeason!,$year:Int!,$page:Int!){
            Page(page:$page,perPage:50){
              pageInfo{hasNextPage}
              media(season:$season,seasonYear:$year,type:ANIME,isAdult:false,sort:POPULARITY_DESC){
                id idMal
                title{romaji english native}
                siteUrl description episodes status season seasonYear
                startDate{year month day}
                genres source averageScore popularity
                coverImage{large extraLarge}
                studios(isMain:true){nodes{name}}
              }
            }
          }
          '''

          def fetch(page):
              body=json.dumps({"query":query,"variables":{"season":season,"year":year,"page":page}}).encode()
              req=urllib.request.Request(
                  'https://graphql.anilist.co',
                  data=body,
                  headers={'User-Agent':'anime-data-github-pages/1.0','Content-Type':'application/json','Accept':'application/json'}
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          rows=[]
          for page in (1,2):
              payload=fetch(page)
              if payload.get('errors'):
                  raise SystemExit(json.dumps(payload['errors'],ensure_ascii=False))
              page_data=payload.get('data',{}).get('Page',{})
              rows.extend(page_data.get('media',[]))
              if not page_data.get('pageInfo',{}).get('hasNextPage'):
                  break

          def norm(a):
              d=a.get('startDate') or {}
              studios=' / '.join(x.get('name','') for x in (a.get('studios') or {}).get('nodes',[]) if x.get('name'))
              cover=a.get('coverImage') or {}
              title=a.get('title') or {}
              return {
                'id':str(a.get('id','')),
                'malId':str(a.get('idMal','')) if a.get('idMal') else '',
                'title':title.get('native') or title.get('romaji') or title.get('english') or '名称不明',
                'kana':title.get('romaji') or title.get('english') or '',
                'season':f'{year}'+('年冬' if season=='WINTER' else '年春' if season=='SPRING' else '年夏' if season=='SUMMER' else '年秋'),
                'date':f"{d.get('year','')}-{int(d.get('month') or 1):02d}-{int(d.get('day') or 1):02d}" if d.get('year') else '未定',
                'weekday':'','time':'',
                'genre':a.get('genres') or [],
                'studio':studios or '未定',
                'source':a.get('source') or '不明',
                'description':' '.join((a.get('description') or '').replace('<br>',' ').split()),
                'image':cover.get('extraLarge') or cover.get('large') or '',
                'official':a.get('siteUrl') or '',
                'streaming':[],'cast':[],'staff':[],
                'score':round((a.get('averageScore') or 0)/10,1),
                'popularity':a.get('popularity') or 0,
                'rank':0,'status':a.get('status') or '',
                'episodes':a.get('episodes'),'type':''
              }

          if len(rows)<5:
              raise SystemExit(f'Too few records: {len(rows)}')

          out='// Auto-updated by GitHub Actions from AniList.\\nconst FALLBACK_ANIME='+json.dumps([norm(a) for a in rows],ensure_ascii=False,indent=2)+';\\n'
          open('data.js','w',encoding='utf-8').write(out)
          print('Wrote',len(rows),'anime records from AniList')
          PY

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          git diff --cached --quiet || git commit -m "Update anime data from AniList"
          git push
